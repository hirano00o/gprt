mutation AddReviewNow(
  $id: ID!
  $event: PullRequestReviewEvent!
  $body: String
  $threads: [DraftPullRequestReviewThread!]
) {
  addPullRequestReview(
    input: { pullRequestId: $id, event: $event, body: $body, threads: $threads }
  ) {
    pullRequestReview {
      id
      state
      body
    }
  }
  rateLimit {
    remaining
    resetAt
  }
}
